services:
  - type: web
    name: nexora-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run db:generate && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: WEB_ORIGIN
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./var/storage
